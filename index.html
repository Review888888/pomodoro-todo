<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>番茄待办 · FocusTodo</title>
<meta name="description" content="一个把番茄钟和任务清单合在一起的小工具，支持 AI 拆解任务与每日复盘">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="13" r="8.2" fill="#E2564F"/>
      <path d="M12 4.8c1.6 0 3 .6 3.6 1.4-.9.5-2 .8-3.6.8s-2.7-.3-3.6-.8C9 5.4 10.4 4.8 12 4.8Z" fill="#12806A"/>
      <path d="M12 4.8c-.4-1.3-1.2-2-2.3-2.3" stroke="#12806A" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    </svg>
    <div class="brand-text">
      <h1>番茄待办</h1>
      <span>FocusTodo</span>
    </div>
  </div>

  <div class="topbar-stats">
    <div class="stat">
      <span class="stat-num" id="todayPomos">0</span>
      <span class="stat-label">今日番茄</span>
    </div>
    <div class="stat">
      <span class="stat-num" id="todayMinutes">0</span>
      <span class="stat-label">专注分钟</span>
    </div>
    <div class="stat">
      <span class="stat-num" id="todayDone">0</span>
      <span class="stat-label">完成任务</span>
    </div>
  </div>

  <button class="icon-btn" id="openSettings" title="设置" aria-label="设置">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
      <circle cx="12" cy="12" r="3.2"/>
      <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.5 1Z"/>
    </svg>
  </button>
</header>

<main class="layout">

  <section class="panel timer-panel" aria-label="番茄钟">
    <div class="timer-head">
      <span class="mode-chip" id="modeChip">专注</span>
      <div class="cycle-dots" id="cycleDots" title="本轮已完成的番茄"></div>
    </div>

    <div class="ring-wrap">
      <svg class="ring" viewBox="0 0 220 220" aria-hidden="true">
        <circle class="ring-track" cx="110" cy="110" r="98"/>
        <circle class="ring-progress" id="ringProgress" cx="110" cy="110" r="98"/>
      </svg>
      <div class="ring-center">
        <div class="time" id="timeText">25:00</div>
        <div class="ring-caption" id="ringCaption">按空格或点开始</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn ghost" id="btnReset">重置</button>
      <button class="btn primary" id="btnStart">开始专注</button>
      <button class="btn ghost" id="btnSkip">跳过</button>
    </div>

    <div class="current-task" id="currentTaskBox">
      <span class="ct-label">当前任务</span>
      <span class="ct-name" id="currentTaskName">未绑定（点任务右侧的圆点绑定）</span>
    </div>

    <div class="week-chart">
      <div class="chart-head">
        <span>最近 7 天</span>
        <span class="chart-total" id="weekTotal">0 个番茄</span>
      </div>
      <div class="bars" id="weekBars"></div>
    </div>
  </section>

  <section class="panel tasks-panel" aria-label="任务清单">
    <div class="tasks-head">
      <div>
        <h2>任务清单</h2>
        <p class="subtitle">预计番茄数可以估算工作量，做完一个番茄自动记一次</p>
      </div>
      <span class="counter" id="taskCounter">0 / 0</span>
    </div>

    <form class="add-row" id="addForm">
      <input id="taskInput" type="text" placeholder="要做什么？例如：写完操作系统实验报告" autocomplete="off" maxlength="80">
      <label class="pomo-field" title="预计需要几个番茄">
        <input id="pomoInput" type="number" min="1" max="9" value="2">
        <span>番茄</span>
      </label>
      <button class="btn primary" type="submit">添加</button>
    </form>

    <div class="ai-row">
      <button class="btn soft" id="btnBreakdown">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <path d="M12 3v3M12 18v3M4.2 12h3M16.8 12h3M6.5 6.5l2.1 2.1M15.4 15.4l2.1 2.1M17.5 6.5l-2.1 2.1M8.6 15.4l-2.1 2.1"/>
        </svg>
        AI 拆解任务
      </button>
      <button class="btn soft" id="btnReview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <path d="M5 4h11l3 3v13H5z"/><path d="M8 11h8M8 15h5"/>
        </svg>
        AI 今日复盘
      </button>
      <span class="ai-badge" id="aiMode">本地规则</span>
    </div>

    <ul class="task-list" id="taskList"></ul>

    <div class="empty" id="emptyState">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <rect x="10" y="8" width="28" height="32" rx="4"/>
        <path d="M18 18h12M18 25h12M18 32h7"/>
      </svg>
      <p>还没有任务。先写下一件让你有点焦虑的事，<br>然后只管做 25 分钟。</p>
    </div>
  </section>

</main>

<div class="modal-mask" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h3 id="modalTitle">AI 拆解任务</h3>
      <button class="icon-btn small" id="modalClose" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </div>

    <div id="modalBody"></div>

    <div class="modal-foot" id="modalFoot" hidden>
      <button class="btn ghost" id="modalCancel">取消</button>
      <button class="btn primary" id="modalConfirm">全部加入清单</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="js/store.js"></script>
<script src="js/ai.js"></script>
<script src="js/timer.js"></script>
<script src="js/stats.js"></script>
<script src="js/tasks.js"></script>
<script src="js/app.js"></script>
</body>
</html>
